
name: Daily Reservation

run-name: "🏋️ AutoWOD – ${{ github.event_name == 'workflow_dispatch' && 'Manual run' || 'Sunday booking' }}"

on:
  schedule:
    # Inicio anticipado para esperar hasta las 09:00 en España.
    - cron: '0 6 * * 0'

  workflow_dispatch:

# Evita que dos ejecuciones puedan solaparse.
concurrency:
  group: reservation
  cancel-in-progress: false

jobs:
  book-session:
    name: Book Workout Sessions
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Get latest code
        uses: actions/checkout@v6

      - name: 🗓️ Decide when to run
        id: schedule-gate
        env:
          BOOKING_FREQUENCY: weekly
          BOOKING_WEEKDAY: sunday
          BOOKING_TIME: '09:00'
          EVENT_NAME: ${{ github.event_name }}
          TZ_NAME: Europe/Madrid
        run: |
          set -euo pipefail

          frequency="$(echo "$BOOKING_FREQUENCY" | tr '[:upper:]' '[:lower:]' | xargs)"
          target_day="$(echo "$BOOKING_WEEKDAY" | tr '[:upper:]' '[:lower:]' | xargs)"
          booking_time="$(echo "$BOOKING_TIME" | xargs)"

          if ! printf '%s' "$booking_time" | grep -qE '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'; then
            echo "Invalid booking time: $booking_time"
            exit 1
          fi

          today_in_madrid="$(TZ="$TZ_NAME" date +%F)"
          target_epoch="$(TZ="$TZ_NAME" date -d "$today_in_madrid $booking_time" +%s)"
          now_epoch="$(date +%s)"

          wait_seconds=$((target_epoch - now_epoch))
          wait_until=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            late_note="Manual execution: read-only test starts immediately."
          elif [ "$wait_seconds" -gt 0 ]; then
            wait_until="$target_epoch"
            late_note="Waiting until $booking_time (Europe/Madrid)."
          else
            late_note="Booking time reached or passed. Starting now."
          fi

          if [ -n "$wait_until" ]; then
            today="$(TZ="$TZ_NAME" date -d "@$target_epoch" +%A | tr '[:upper:]' '[:lower:]')"
          else
            today="$(TZ="$TZ_NAME" date +%A | tr '[:upper:]' '[:lower:]')"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual read-only execution requested." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$frequency" = "weekly" ] && [ "$today" != "$target_day" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Today is $today, not $target_day. Skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "AutoWOD scheduled for Sunday at $booking_time (Europe/Madrid)." >> "$GITHUB_STEP_SUMMARY"
            echo "$late_note" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "wait_until=$wait_until" >> "$GITHUB_OUTPUT"
          echo "booking_time=$booking_time" >> "$GITHUB_OUTPUT"
          echo "$late_note"

      - name: 📦 Install pnpm
        if: steps.schedule-gate.outputs.should_run == 'true'
        uses: pnpm/action-setup@v6

      - name: 🔧 Set up Node.js
        if: steps.schedule-gate.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 💾 Cache pnpm store
        if: steps.schedule-gate.outputs.should_run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: 📚 Install dependencies
        if: steps.schedule-gate.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: 🔍 Check TypeScript
        if: steps.schedule-gate.outputs.should_run == 'true'
        run: pnpm typecheck

      - name: 💾 Cache Puppeteer browser
        if: steps.schedule-gate.outputs.should_run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            puppeteer-cache-${{ runner.os }}-

      - name: 🌐 Install Chrome for Puppeteer
        if: steps.schedule-gate.outputs.should_run == 'true'
        run: pnpm exec puppeteer browsers install chrome

      - name: ⏳ Wait until 09:00
        if: ${{ steps.schedule-gate.outputs.should_run == 'true' && steps.schedule-gate.outputs.wait_until != '' }}
        env:
          WAIT_UNTIL: ${{ steps.schedule-gate.outputs.wait_until }}
          BOOKING_TIME: ${{ steps.schedule-gate.outputs.booking_time }}
          TZ_NAME: Europe/Madrid
        run: |
          set -euo pipefail

          remaining=$((WAIT_UNTIL - $(date +%s)))

          if [ "$remaining" -le 0 ]; then
            echo "Booking time already reached."
            exit 0
          fi

          echo "Waiting ${remaining} seconds until $BOOKING_TIME ($TZ_NAME)..."
          sleep "$remaining"

          echo "Current time: $(TZ="$TZ_NAME" date '+%F %T %Z')"

      - name: 🧪 Ejecutar prueba de lectura (sin reservar)
        if: steps.schedule-gate.outputs.should_run == 'true'
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}

          MONDAY: ${{ vars.MONDAY }}
          TUESDAY: ${{ vars.TUESDAY }}
          WEDNESDAY: ${{ vars.WEDNESDAY }}
          THURSDAY: ${{ vars.THURSDAY }}
          FRIDAY: ${{ vars.FRIDAY }}
          SATURDAY: ${{ vars.SATURDAY }}
          SUNDAY: ${{ vars.SUNDAY }}

          AVAILABLE_DAYS: ${{ vars.AVAILABLE_DAYS }}
          DRY_RUN: 'true'

        run: pnpm start
